{% extends "base.html" %}
{% block title %}{{ t('persist.title') }} · {{ name }}{% endblock %}
{% block content %}
<p><a href="/configs">{{ t('form.back_to_configs') }}</a></p>
<h1>{{ t('persist.title') }} · <span class="mono">{{ name }}</span></h1>
<p class="hint">{{ t('persist.help') }}</p>

{% if error %}<p class="errbox">{{ error }}</p>{% endif %}

<form method="post" action="/configs/{{ name }}/persistence" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>{{ t('persist.field') }}
    <textarea name="bank_fints_persistence" rows="4" class="mono"
              placeholder="eyJ2ZXJzaW9uIjoy..." required></textarea>
  </label>
  <button type="submit">{{ t('persist.save') }}</button>
</form>
{% endblock %}
