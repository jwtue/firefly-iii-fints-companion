{% extends "base.html" %}
{% block title %}{{ t('login.title') }} · {{ t('brand') }}{% endblock %}
{% block content %}
<div class="login">
  <h1>{{ t('login.title') }}</h1>
  {% if error %}<p class="errbox">{{ error }}</p>{% endif %}
  {% if password_auth_enabled %}
  <form method="post" action="/login">
    <label>{{ t('login.password') }}
      <input type="password" name="password" autocomplete="current-password" autofocus>
    </label>
    <button type="submit">{{ t('login.submit') }}</button>
  </form>
  {% else %}
  <p class="hint">{{ t('login.disabled')|safe }}</p>
  {% endif %}
</div>
{% endblock %}
