{% extends "base.html" %}
{% block title %}{{ t('delete.title') }} · {{ name }}{% endblock %}
{% block content %}
<h1>{{ t('delete.title') }}</h1>
<div class="errbox">
  <p>{{ t('delete.warning', name='<strong class="mono">' ~ name ~ '</strong>')|safe }}</p>
</div>
<form method="post" action="/configs/{{ name }}/delete" class="inline">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit">{{ t('delete.confirm') }}</button>
</form>
<a href="/configs" style="margin-left:1rem">{{ t('action.cancel') }}</a>
{% endblock %}
